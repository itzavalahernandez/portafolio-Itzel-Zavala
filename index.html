<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Itzel - Java Full Stack</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Fira Code (estilo terminal) -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- CSS Local -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <main class="terminal-container">
            
            <!-- SECCIÓN HERO -->
            <section id="hero">
                <h1 class="mb-4">Hola, soy Itzel Zavala</h1>
                <p class="mb-1">Java Full Stack Developer</p>
                <p class="mb-4">Desarrollo aplicaciones web y APIs REST.</p>
                
                <div class="d-flex flex-wrap">
                    <button id="btn-proyectos" class="btn-terminal">[ Ver proyectos ]</button>
                    <a href="https://github.com" target="_blank" class="btn-terminal">[ GitHub ]</a>
                </div>
            </section>

            <!-- SEPARADOR -->
            <hr class="section-divider">

            <!-- SECCIÓN HABILIDADES -->
            <section id="skills">
                <h2 class="mb-3">Habilidades</h2>
                <ul class="skills-list">
                    <li>Java</li>
                    <li>Spring Boot</li>
                    <li>MySQL</li>
                    <li>JavaScript</li>
                    <li>React</li>
                    <li>Git</li>
                    <li>GitHub</li>
                    <li>REST APIs</li>
                </ul>
            </section>

            <!-- SEPARADOR -->
            <hr class="section-divider">

            <!-- SECCIÓN PROYECTOS -->
            <section id="projects">
                <h2 class="mb-4">Proyectos</h2>
                
                <div class="row g-4">
                    <!-- Proyecto 1 -->
                    <div class="col-md-4">
                        <div class="project-card">
                            <div class="project-title">E-commerce</div>
                            <a href="#" class="btn-terminal w-100">[Demo]</a>
                        </div>
                    </div>

                    <!-- Proyecto 2 -->
                    <div class="col-md-4">
                        <div class="project-card">
                            <div class="project-title">Inventario</div>
                            <a href="#" class="btn-terminal w-100">[Demo]</a>
                        </div>
                    </div>

                    <!-- Proyecto 3 -->
                    <div class="col-md-4">
                        <div class="project-card">
                            <div class="project-title">API Usuarios</div>
                            <a href="#" class="btn-terminal w-100">[Demo]</a>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS Local -->
    <script src="script.js"></script>
</body>
</html>
